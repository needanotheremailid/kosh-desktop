name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Read the requested repository revision
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git --hostname github.com
          if ($LASTEXITCODE -ne 0) { throw 'Git authentication setup failed.' }
          gh repo clone "$env:GITHUB_REPOSITORY" . -- --no-checkout
          if ($LASTEXITCODE -ne 0) { throw 'Checkout failed.' }
          git fetch origin "$env:GITHUB_SHA" --depth=1
          if ($LASTEXITCODE -ne 0) { throw 'Revision fetch failed.' }
          git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Revision checkout failed.' }
          $checkedRevision = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $checkedRevision -ne $env:GITHUB_SHA) { throw 'Checked revision differs from the requested event commit.' }
      - name: Check Python and JavaScript syntax
        shell: pwsh
        run: |
          python -m compileall -q -x 'vendor|work|data' .
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax check failed.' }
          node --check ui/app.js
          if ($LASTEXITCODE -ne 0) { throw 'JavaScript syntax check failed.' }
          node --check ui/reading.js
          if ($LASTEXITCODE -ne 0) { throw 'Reading JavaScript syntax check failed.' }
          node --check ui/writing_review.js
          if ($LASTEXITCODE -ne 0) { throw 'Writing review JavaScript syntax check failed.' }
          node tests/test_reading_ui.js
          if ($LASTEXITCODE -ne 0) { throw 'Reading UI checks failed.' }
          node tests/test_writing_review_ui.js
          if ($LASTEXITCODE -ne 0) { throw 'Writing review checks failed.' }
          foreach ($module in @('auto_backup','reviewer','project_review','updater','maintenance','revisions','installation_health','research_workflows','overview','screening','verify')) {
            node --check "ui/$module.js"
            if ($LASTEXITCODE -ne 0) { throw "Syntax check failed: $module" }
          }
          node tests/test_reviewer_ui.js
          if ($LASTEXITCODE -ne 0) { throw 'Reviewer UI checks failed.' }
          node tests/test_project_review_ui.js
          if ($LASTEXITCODE -ne 0) { throw 'Project review UI checks failed.' }
          node tests/test_revision_compare_ui.js
          if ($LASTEXITCODE -ne 0) { throw 'Revision comparison UI checks failed.' }
          node tests/test_installation_health_ui.js
          if ($LASTEXITCODE -ne 0) { throw 'Installation diagnostics UI checks failed.' }
          node tests/test_complete_details_ui.js
          if ($LASTEXITCODE -ne 0) { throw 'Missing-detail completion checks failed.' }
          node tests/test_reference_paste_ui.js
          if ($LASTEXITCODE -ne 0) { throw 'Reference paste checks failed.' }
          node tests/test_rc5_ui.js
          if ($LASTEXITCODE -ne 0) { throw 'Interface contract checks failed.' }
          node tests/test_shell_ui.js
          if ($LASTEXITCODE -ne 0) { throw 'Research-path shell and Overview checks failed.' }
      - name: Check Synthesise page and workspace guards
        shell: pwsh
        run: |
          node --check tests/test_synthesise_ui.js
          if ($LASTEXITCODE -ne 0) { throw 'Synthesise test syntax check failed.' }
          node tests/test_synthesise_ui.js
          if ($LASTEXITCODE -ne 0) { throw 'Synthesise page checks failed.' }
      - name: Check Screen page and manual decision guards
        shell: pwsh
        run: |
          node --check tests/test_screening_ui.js
          if ($LASTEXITCODE -ne 0) { throw 'Screening test syntax check failed.' }
          node tests/test_screening_ui.js
          if ($LASTEXITCODE -ne 0) { throw 'Screening page checks failed.' }
      - name: Check Verify page and claim review guards
        shell: pwsh
        run: |
          node --check tests/test_verify_ui.js
          if ($LASTEXITCODE -ne 0) { throw 'Verify test syntax check failed.' }
          node tests/test_verify_ui.js
          if ($LASTEXITCODE -ne 0) { throw 'Verify page checks failed.' }
      - name: Compile the Windows launcher without running a native dialog
        shell: pwsh
        run: |
          $launcherCompiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $launcherOutput = Join-Path $env:RUNNER_TEMP 'Kosh-launcher-source-check.exe'
          $launcherSource = Join-Path $PWD 'native\Launcher.cs'
          if (-not (Test-Path -LiteralPath $launcherCompiler -PathType Leaf)) { throw 'The installed .NET Framework compiler is unavailable.' }
          & $launcherCompiler /nologo /target:winexe /optimize+ /reference:System.Windows.Forms.dll /reference:System.Web.Extensions.dll "/out:$launcherOutput" "$launcherSource"
          if ($LASTEXITCODE -ne 0) { throw 'Native launcher compilation failed.' }
      - name: Check diagnostic privacy and local backup/dialog contracts
        shell: pwsh
        run: |
          python -m unittest tests.test_installation_health tests.test_local_dialog tests.test_local_backup_ui tests.test_search_work_budget -v
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic privacy or local backup/dialog checks failed.' }
      - name: Check local research packets and agent routes
        shell: pwsh
        run: |
          python -m unittest tests.test_research_workflows tests.test_research_agent tests.test_server tests.test_mcp -v
          if ($LASTEXITCODE -ne 0) { throw 'Research packet or scoped agent checks failed.' }
      - name: Check bibliography parsing and folder recovery
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_bibliography.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Bibliography checks failed.' }
          python -m unittest discover -s tests -p test_folder_edits.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Folder recovery checks failed.' }
